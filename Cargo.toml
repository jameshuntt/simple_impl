[package]
name = "simple_impl"
version = "0.1.8"
edition = "2021"

license = "MIT OR Apache-2.0"
description = "Macros that make a command-line builder short: sc_* assemble the argument vector from a struct, builder_* write its setters."
rust-version = "1.70"
keywords = ["macro", "builder", "cli", "shell", "command"]
categories = ["command-line-interface", "rust-patterns"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

authors = ["James Hunt <james@1o.business>"]
repository = "https://github.com/jameshuntt/simple_impl"
readme = "README.md"

[features]
default = []
derive = ["dep:simple_impl_derive"]

[dependencies]
simple_impl_derive = { version = "0.2.1", path = "../simple_impl_derive", optional = true }