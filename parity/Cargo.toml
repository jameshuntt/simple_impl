[package]
name = "simple_impl_parity"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Checks that this release of simple_impl_derive builds the same commands as the previous release. Never published: crates.io cannot hold two versions of one crate in one manifest."
license = "MIT OR Apache-2.0"

[dev-dependencies]
simple_impl = { path = "..", features = ["derive"] }
simple_impl_derive = { path = "../../simple_impl_derive" }
# the previous release; move this forward after each release
old_derive = { package = "simple_impl_derive", version = "=0.2.5" }
